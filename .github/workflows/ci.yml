name: CI — Test & Lint

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Job 1: Run all 69 unit tests ──────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/fastapi

    env:
      # All values are safe CI-only placeholders — no real secrets needed.
      TESTING: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      UPSTASH_REDIS_URL: "redis://localhost:6379"
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
      FIELD_ENCRYPTION_KEY: "dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1mb3ItY2k="
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_KEY: "placeholder"
      ENVIRONMENT: "testing"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_e2e.py \
            --tb=short \
            -q

  # ── Job 2: Lint with Ruff ─────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/fastapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.4.4"

      - name: Ruff check
        run: ruff check app/ --ignore E501,F401
