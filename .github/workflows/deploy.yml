name: CD — Build Image & Deploy to Render

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/careremind-api

jobs:
  # ── 1. Run tests first (inline — no cross-workflow call) ──────────────────
  test:
    name: Unit Tests (CI Gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fastapi
    env:
      TESTING: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      UPSTASH_REDIS_URL: "redis://localhost:6379"
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
      FIELD_ENCRYPTION_KEY: "cNqjNonaE7gSQLUUKNe8RasEbiCDhwGnnHmPbWqrE7w="
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_KEY: "placeholder"
      ENVIRONMENT: "testing"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/fastapi/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run 69 unit tests
        run: python -m pytest tests/ --ignore=tests/test_e2e.py -q --tb=short

  # ── 2. Build & push Docker image to GHCR ─────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]          # Only runs if tests pass
    permissions:
      contents: read
      packages: write      # Needed to push to GHCR
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./services/fastapi
          file: ./services/fastapi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Check if deploy hook is configured ────────────────────────────────
  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    outputs:
      has-render-hook: ${{ steps.check.outputs.has-render-hook }}
    steps:
      - id: check
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "has-render-hook=false" >> $GITHUB_OUTPUT
          else
            echo "has-render-hook=true" >> $GITHUB_OUTPUT
          fi

  # ── 4. Trigger Render deploy ──────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build-and-push, check-secrets]    # Only runs after image is pushed and secrets checked
    if: ${{ needs.check-secrets.outputs.has-render-hook == 'true' }}
    steps:
      - name: Trigger Render deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render hook status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ] || \
            { echo "Deploy hook failed: $HTTP_STATUS"; exit 1; }

      - name: Wait for Render restart
        run: sleep 90

      - name: Health check live API
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "https://careremind-api.onrender.com/health" 2>/dev/null || echo 000)
            echo "Attempt $i/5 -> HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "API healthy!"; exit 0; }
            sleep 20
          done
          echo "API did not become healthy"; exit 1

      - name: Summary
        run: |
          echo "Deploy complete"
          echo "API:  https://careremind-api.onrender.com"
          echo "Docs: https://careremind-api.onrender.com/docs"
