name: CD — Build Image & Deploy to Render

on:
  push:
    branches: ["main"]

# Prevent concurrent deploys — wait for previous to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GitHub Container Registry — free, private, tied to your GitHub account
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/careremind-api

jobs:
  # ── Gate: must pass all unit tests before building image ──────────────────
  test:
    name: Unit Tests (CI Gate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/fastapi

    env:
      TESTING: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      UPSTASH_REDIS_URL: "redis://localhost:6379"
      JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-long"
      FIELD_ENCRYPTION_KEY: "dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1mb3ItY2k="
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_KEY: "placeholder"
      ENVIRONMENT: "testing"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/fastapi/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run 69 unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_e2e.py \
            -q --tb=short

  # ── Build + push Docker image to GHCR ────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]

    permissions:
      contents: read
      packages: write    # Required to push to GHCR

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Auto-provided, no setup needed

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag latest on main
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with short commit SHA for traceability (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Tag with branch name
            type=ref,event=branch

      - name: Set up Docker Buildx (multi-platform builder)
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./services/fastapi
          file: ./services/fastapi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from previous builds — speeds up CI from ~4min → ~90s
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  # ── Trigger Render deploy ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Trigger Render API deploy hook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render hook status: $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ] || \
            { echo "Deploy hook failed: $HTTP_STATUS"; exit 1; }

      - name: Trigger Render Worker deploy hook
        if: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}"
          echo "Worker deploy triggered"

      - name: Wait for containers to restart
        run: sleep 90

      - name: Health check — API live after deploy
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "https://careremind-api.onrender.com/health" 2>/dev/null || echo 000)
            echo "Attempt $i/5 → HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "API healthy!"; exit 0; }
            sleep 20
          done
          echo "API did not become healthy after 5 attempts"
          exit 1

      - name: Deploy summary
        run: |
          echo "================================================"
          echo "  Deploy complete"
          echo "  API:   https://careremind-api.onrender.com"
          echo "  Docs:  https://careremind-api.onrender.com/docs"
          echo "  Image: ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "================================================"
