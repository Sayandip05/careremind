version: '3.8'

# ── CareRemind Production Compose ────────────────────────────
# Database:   Supabase (external — no postgres service here)
# Redis:      Upstash Redis (external, TLS) — no container needed
# Frontend:   Deployed on Vercel (no container)
# Target:     ~800 concurrent doctors on a single server
#
# All Python services build from ONE Dockerfile (services/fastapi).
# Scale path: add more api replicas + PgBouncer for 2000+ doctors.

services:
  api:
    build: ./services/fastapi
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=4
      # DB pool tuned for 800 concurrent doctors:
      # 4 workers × 15 connections = 60 total → sufficient for 800 req/s at typical clinic load
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build: ./services/fastapi  # Same image as api
    restart: always
    command:
      - "celery"
      - "-A"
      - "app.worker.celery_app"
      - "worker"
      - "--loglevel=info"
      - "-Q"
      - "careremind"                  # Consume only from the isolated queue
      - "--concurrency=4"
      - "--max-tasks-per-child=1000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    deploy:
      replicas: 2  # 2 Celery worker containers for reminder delivery throughput

  # Frontend deploys to Vercel — no container needed.
  # Redis (Upstash) is external — no container needed.
