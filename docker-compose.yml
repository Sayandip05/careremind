version: '3.8'

# ── CareRemind — Single Compose File ─────────────────────────────────────────
#
# Deployment target : Render (render.com)
# Database          : Supabase (external PostgreSQL) — no postgres container
# Cache / Queue     : Upstash Redis (external, TLS)  — no redis container
# Frontend          : Vercel (static deploy)          — no nginx container
# Scheduler         : APScheduler embedded inside FastAPI lifespan
#
# Both services build from the SAME Dockerfile (services/fastapi).
# Scale path: add more api replicas + PgBouncer for 2000+ concurrent doctors.

services:

  # ── FastAPI (REST + WebSocket + APScheduler) ────────────────────────────────
  api:
    build: ./services/fastapi
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      # Gunicorn workers: set via WEB_CONCURRENCY env var on Render dashboard
      # 4 workers × 15 DB connections = 60 pool connections → handles ~800 doctors
      - DB_POOL_SIZE=15
      - DB_MAX_OVERFLOW=15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Celery Worker (background tasks: reminders, summaries, cleanup) ─────────
  worker:
    build: ./services/fastapi   # Same image as api — no separate Dockerfile needed
    restart: always
    command:
      - "celery"
      - "-A"
      - "app.worker.celery_app"
      - "worker"
      - "--loglevel=info"
      - "-Q"
      - "careremind"            # Consume only from the isolated queue
      - "--concurrency=4"
      - "--max-tasks-per-child=1000"   # Prevent memory leaks in long-running workers
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production

  # ── NOT included (external / separate deploy) ───────────────────────────────
  # postgres  → Supabase  (set DATABASE_URL in .env / Render env vars)
  # redis     → Upstash   (set REDIS_URL in .env / Render env vars)
  # frontend  → Vercel    (cd frontend && vercel deploy)
