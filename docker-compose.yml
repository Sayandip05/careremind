version: '3.8'

# ── CareRemind Dev Compose ────────────────────────────────────
# All Python services build from the SAME image (services/fastapi).
# This is the correct modular monolith layout:
#   - api     → uvicorn with --reload (hot reload for development)
#   - worker  → celery worker (consumes background tasks from Upstash Redis)
#
# Redis:     Upstash (external, TLS) — no local redis container needed.
# Postgres:  Supabase in production; local postgres:15 for dev convenience.
# Scheduler: runs embedded inside the FastAPI lifespan (APScheduler).

services:
  api:
    build: ./services/fastapi
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/fastapi:/app

  worker:
    build: ./services/fastapi  # Same image as api — no separate Dockerfile needed
    command:
      - "celery"
      - "-A"
      - "app.worker.celery_app"
      - "worker"
      - "--loglevel=info"
      - "-Q"
      - "careremind"                    # Consume only from the isolated queue
      - "--max-tasks-per-child=1000"    # Prevent memory leaks in long-running workers
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/fastapi:/app         # Shares code with api

  # Frontend deploys to Vercel — no container needed.

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careremind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d careremind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
